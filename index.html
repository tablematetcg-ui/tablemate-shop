<style id="app-style">/* Layout idea: a vendor's table. Dark ink header band, then a bright card grid where the card art does the talking. */
:root{
  --bg:#f2f5fa; --surface:#ffffff; --ink:#0d1b36; --muted:#56627a; --line:#dbe2ee;
  --accent:#f6b519; --accent-ink:#0d1b36; --blue:#1f6fe0; --gold:#f6b519; --red:#d8322a; --band:#0d1b36; --band-ink:#f2f5fa; --tile:#e6ecf6;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1428; --surface:#112040; --ink:#eef2f9; --muted:#9eabc4; --line:#21345a;
  --accent:#f6b519; --accent-ink:#0d1b36; --blue:#5b9bff; --gold:#f6c23e; --red:#ff5a4d; --band:#071023; --band-ink:#eef2f9; --tile:#17294d; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a1428; --surface:#112040; --ink:#eef2f9; --muted:#9eabc4; --line:#21345a;
  --accent:#f6b519; --accent-ink:#0d1b36; --blue:#5b9bff; --gold:#f6c23e; --red:#ff5a4d; --band:#071023; --band-ink:#eef2f9; --tile:#17294d; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px/1 var(--body);text-decoration:none;cursor:pointer;transition:transform .12s ease,background .12s ease}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.small{min-height:34px;padding:0 12px;font-size:13px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.55;cursor:default;transform:none}

.ownerbar{background:var(--gold);color:#1d1503;font-size:13px}
.ob-in{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 20px}
.ob-in .btn{background:#1d1503;color:#fff3d1;border-color:#1d1503}
.ob-msg{font-weight:600}

.top{background:var(--band);color:var(--band-ink)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:14px;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.mark{height:46px;width:auto}
.hero-side{display:grid;gap:18px;justify-items:center}
.hero-logo{width:min(100%,300px);height:auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35))}
.foot-brand{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--ink)}
.foot-brand img{height:26px;width:auto}
.word{font:800 23px/1 var(--display);letter-spacing:-.02em;font-style:italic}
.tcg{font:800 13px/1 var(--display);font-style:normal;margin-left:7px;padding:4px 7px;border-radius:6px;background:var(--gold);color:var(--band);vertical-align:3px;letter-spacing:.06em}
.btn.ig{background:transparent;color:var(--band-ink);border-color:rgba(255,255,255,.28)}
.hero{background:radial-gradient(900px 420px at 85% 30%,color-mix(in srgb,var(--blue) 35%,transparent),transparent 70%),var(--band)}

.hero{color:var(--band-ink);padding:26px 0 40px}
.hero-in{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px;align-items:center}
.kicker{font:500 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--gold);margin:0 0 12px}
.hero h1{font-size:clamp(30px,4.6vw,52px);line-height:1.04;font-weight:800;max-width:18ch}
.lede{color:color-mix(in srgb,var(--band-ink) 78%,transparent);max-width:58ch;margin:16px 0 22px;font-size:17px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.hero .btn.ghost{color:var(--band-ink);border-color:rgba(255,255,255,.28)}
.stats{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;margin:0;background:rgba(255,255,255,.14);border-radius:var(--r);overflow:hidden}
.stats div{background:var(--band);padding:16px 18px;background:color-mix(in srgb,var(--band) 88%,#fff)}
.stats dt{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;opacity:.7}
.stats dd{margin:8px 0 0;font:800 34px/1 var(--display);font-variant-numeric:tabular-nums}
.updated{grid-column:1/-1;margin:0;padding:10px 18px;font-size:13px;background:color-mix(in srgb,var(--band) 88%,#fff);opacity:.85}

.shop{padding-top:26px;padding-bottom:48px}
.controls{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px/1 var(--body);cursor:pointer}
.tab .ct{font:500 12px/1 var(--mono);color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] .ct{color:inherit;opacity:.7}
.tools{display:flex;gap:10px;flex-wrap:wrap;flex:1;justify-content:flex-end}
.search{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);flex:1;min-width:220px;max-width:380px}
.search input{border:0;background:transparent;color:var(--ink);font:15px var(--body);width:100%;outline:none}
.sort select{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:500 14px var(--body)}
.count{color:var(--muted);font-size:14px;margin:14px 0}

.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:18px}
.card-btn{all:unset;box-sizing:border-box;display:flex;flex-direction:column;width:100%;height:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease}
.card-btn:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(14,23,38,.45)}
.card-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.art-wrap{position:relative;background:var(--tile);aspect-ratio:5/6;display:grid;place-items:center;padding:14px}
.art{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.ph{display:flex;flex-direction:column;justify-content:flex-end;gap:auto;aspect-ratio:5/7;height:100%;width:auto;max-width:100%;padding:12px;border-radius:10px;background:linear-gradient(160deg,var(--band),color-mix(in srgb,var(--band) 55%,var(--blue)));color:var(--band-ink);filter:none}
.ph-kind{font:500 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--gold)}
.ph-num{font:800 22px/1 var(--display);margin-bottom:auto;margin-top:auto}
.ph-name{font:600 13px/1.25 var(--body)}
.grade{position:absolute;top:10px;left:10px;font:600 11px/1 var(--mono);padding:6px 8px;border-radius:6px;background:var(--blue);color:#fff;letter-spacing:.04em}
.grade.sealed{background:var(--ink);color:var(--bg)}
.qty{position:absolute;bottom:10px;right:10px;font:500 11px/1 var(--mono);padding:5px 7px;border-radius:6px;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.meta{display:flex;flex-direction:column;gap:3px;padding:12px 14px 14px;flex:1}
.num{font:500 12px/1.2 var(--mono);color:var(--muted)}
.name{font:700 16px/1.25 var(--display)}
.ver{font-size:13px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{margin-top:auto;padding-top:8px}
.price{font:800 19px/1 var(--display);font-variant-numeric:tabular-nums}
.price.ask{font:600 14px/1 var(--body);color:var(--blue)}
.price.big{font-size:32px}
.price.ask.big{font-size:18px}
.empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}

.sell{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sell-in{display:flex;justify-content:space-between;align-items:center;gap:24px;padding-top:34px;padding-bottom:34px;flex-wrap:wrap}
.sell h2{font-size:28px}
.sell p{color:var(--muted);max-width:60ch;margin:8px 0 0}
.share{border-bottom:1px solid var(--line)}
.share-in{display:flex;align-items:center;gap:28px;padding-top:34px;padding-bottom:34px;flex-wrap:wrap}
.qr-box{width:150px;height:150px;padding:10px;background:#fff;border-radius:12px;flex:none;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.qr-svg{width:100%;height:100%;display:block}
.share h2{font-size:28px}
.share p{color:var(--muted);max-width:52ch;margin:8px 0 14px}
.share-link{font:600 18px/1.2 var(--mono);color:var(--ink);display:inline-block;margin-bottom:14px;word-break:break-all}
.share-btns{display:flex;gap:10px;flex-wrap:wrap}
.foot{color:var(--muted);font-size:13px}
.foot-in{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;padding-top:22px;padding-bottom:30px}

.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(6,10,18,.62)}
.sheet{position:relative;background:var(--surface);border-radius:20px;max-width:940px;width:100%;max-height:calc(100% - 8px);overflow:auto;padding:26px}
.x{position:absolute;top:10px;right:12px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:24px;line-height:1;cursor:pointer;z-index:1}
.m-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:30px}
.m-main{background:var(--tile);border-radius:var(--r);padding:22px;display:grid;place-items:center;aspect-ratio:5/6}
.m-main img,.m-main .art{max-height:100%;width:auto;max-width:100%;object-fit:contain}
.art.big{height:100%}
.thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.thumb{width:58px;height:58px;padding:3px;border-radius:10px;border:2px solid var(--line);background:var(--tile);cursor:pointer}
.thumb.on{border-color:var(--blue)}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:6px}
.artnote{font-size:12px;color:var(--muted);margin:10px 0 0}
.m-info h2{font-size:32px;line-height:1.1}
.m-ver{color:var(--muted);margin:6px 0 16px}
.m-price{padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.specs{margin:14px 0 18px;display:grid;gap:0}
.specs div{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.specs dt{color:var(--muted);font-size:14px}
.specs dd{margin:0;font-weight:500}
.m-cta{display:grid;gap:10px}
.fine{font-size:13px;color:var(--muted);margin:12px 0 0}
.owner-tools{margin-top:18px;padding:12px;border:1px dashed var(--gold);border-radius:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ot-title{width:100%;margin:0;font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--gold)}
.ot-note{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}

.shows{padding:30px 0 6px}
.shows-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.shows-head h2{font-size:28px}
.shows-head p{margin:0;color:var(--muted);max-width:52ch}
.show-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.show{display:flex;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.show-date{flex:none;width:86px;border-radius:12px;background:var(--band);color:var(--band-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 6px;text-align:center}
.sd-mon{font:500 12px/1 var(--mono);letter-spacing:.12em;color:var(--gold)}
.sd-days{font:800 22px/1.05 var(--display);margin-top:6px;font-variant-numeric:tabular-nums}
.show-body h3{margin:0;font:700 19px/1.2 var(--display)}
.show-body p{margin:4px 0 0;font-size:14px}
.show-when{font-weight:600}
.show-where{color:var(--muted)}
.show-where a{color:var(--blue)}
.show-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px!important}
.tag{font:500 12px/1 var(--mono);padding:6px 8px;border-radius:6px;background:var(--tile);color:var(--ink);text-decoration:none}
.tag.link{color:var(--blue)}
@media (max-width:820px){
  .hero-in{grid-template-columns:1fr;gap:24px}
  .hero-side{order:-1}
  .hero-logo{width:min(70%,240px)}
  .m-grid{grid-template-columns:1fr}
  .m-main{aspect-ratio:auto;max-height:52vh}
}
@media (max-width:480px){
  .wrap{padding:0 16px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .meta{padding:10px}
  .name{font-size:14px}
  .price{font-size:16px}
  .btn.ig span{display:none}
  .stats dd{font-size:28px}
  .sheet{padding:18px}
  .specs div{grid-template-columns:110px 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function remember(){try{localStorage.setItem("tm-shop",JSON.stringify({sort,tab}))}catch(e){}}

/* personal collection: copies kept, never listed (id: number of copies kept) */
/* mihawkM, boaW115 and perona-op14-033 are raw copies out at grading (Nov 16): hidden until they return */
const PERSONAL={borsalino:1,mihawkM:1,boaW115:1,"perona-op14-033":1,t_zoro1st:1,sealed13:1,t_shanksS:1,t_buggyS:1,t_crossg:1,t_comeon:1,t_myera:1,t_boaM:1,t_frighten:1};
/* most copies that can be for sale (Nov 16): one LEGO Luffy winner is at grading, four Teach SEC are in a deck */
const MAXQTY={luffyW110:1,teachS:1};
function items(){return STATE.items.map(c=>MAXQTY[c.id]&&(c.qty||0)>MAXQTY[c.id]?Object.assign({},c,{qty:MAXQTY[c.id]}):c).map(c=>PERSONAL[c.id]?Object.assign({},c,{qty:(c.qty||0)-PERSONAL[c.id]}):c).filter(c=>(c.qty||0)>0&&c.status!=="hold"&&c.status!=="grading"&&c.status!=="incoming"&&c.status!=="sold")}
function hashOf(id){return "c-"+String(id).replace(/[^A-Za-z0-9-]/g,"-")}
function byHash(h){return items().find(c=>hashOf(c.id)===h)}
function img(c){const p=STATE.photos[c.id];if(p&&p.length)return p[0];return STATE.art[c.id]||null}
function gallery(c){return [...(STATE.photos[c.id]||[]),...(STATE.art[c.id]?[STATE.art[c.id]]:[])]}
function cleanVer(v){return String(v||"").replace(/\s*\(TCGplayer lists it as Parallel\)/i,"").replace(/,?\s*card only$/i,"")}
function condition(c){return c.kind==="slab"?(c.grade||"Graded"):c.kind==="sealed"?"Factory sealed":"Raw, ungraded"}
/* prices are hidden on the shop at the owner's request: every listing shows DM for price */
function priceHTML(c,big){return `<span class="price ask${big?" big":""}">DM for price</span>`}

function visible(){
  const t=q.trim().toLowerCase();
  let list=items().filter(c=>tab==="all"||c.kind===tab);
  if(t)list=list.filter(c=>[c.name,c.num,c.ver,c.set,c.grade].join(" ").toLowerCase().includes(t));
  const rank={slab:0,sealed:1,raw:2};
  const priced=(a,b,dir)=>{const A=has(a.ask),B=has(b.ask);if(A!==B)return A?-1:1;if(!A)return 0;return dir*(a.ask-b.ask)};
  list.sort((a,b)=>{
    if(sort==="high")return priced(a,b,-1)||(a.order||0)-(b.order||0);
    if(sort==="low")return priced(a,b,1)||(a.order||0)-(b.order||0);
    if(sort==="new")return String(b.added||"").localeCompare(String(a.added||""))||(b.order||0)-(a.order||0);
    if(sort==="name")return a.name.localeCompare(b.name)||a.num.localeCompare(b.num);
    return rank[a.kind]-rank[b.kind]||(a.order||0)-(b.order||0);
  });
  return list;
}

function tileArt(c,cls){
  const u=img(c);
  if(u)return `<img class="${cls}" src="${esc(u)}" alt="${esc(c.name+" "+c.num)}" loading="lazy" decoding="async">`;
  return `<div class="${cls} ph" aria-hidden="true"><span class="ph-num">${esc(c.num)}</span><span class="ph-name">${esc(c.name)}</span></div>`;
}

function cardHTML(c){
  const badge=c.kind==="slab"?`<span class="grade">${esc(c.grade||"Graded")}</span>`:c.kind==="sealed"?`<span class="grade sealed">Sealed</span>`:"";
  return `<li class="card">
    <button type="button" class="card-btn" data-open="${esc(c.id)}" aria-label="${esc(c.name+" "+c.num+", view details")}">
      <div class="art-wrap">${tileArt(c,"art")}${badge}${(c.qty||0)>1?`<span class="qty">${c.qty} available</span>`:""}</div>
      <div class="meta">
        <span class="num">${esc(c.num)}</span>
        <span class="name">${esc(c.name)}</span>
        <span class="ver">${esc(cleanVer(c.ver))}</span>
        <span class="row">${priceHTML(c)}</span>
      </div>
    </button>
  </li>`;
}

async function ownerAction(kind,id){
  if(kind==="sync"){syncFromDrive(true);return}
  if(kind==="clearphotos"){delete STATE.photos[id];save("Your photos were removed.");return}

}
async function uploadPhotos(id,files){
  if(!assets||!files.length)return;
  toast("Uploading "+files.length+" photo"+(files.length>1?"s":"")+"…");
  try{
    const urls=[];
    for(const f of files){const r=await assets.upload(await shrinkFile(f,1400));urls.push(r.url)}
    STATE.photos[id]=[...(STATE.photos[id]||[]),...urls];
    save("Photos added.");
  }catch(e){toast("That upload did not go through. Try a smaller image or try again.")}
}
async function shrinkFile(f,max){
  try{const bm=await createImageBitmap(f);const s=Math.min(1,max/Math.max(bm.width,bm.height));if(s===1&&f.size<1.5e6)return f;
    const c=document.createElement("canvas");c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||f),"image/jpeg",0.86));}catch(e){return f}
}

/* stock art import: the owner's Claude session posts images in, one per card */
window.addEventListener("message",async e=>{
  const d=e.data;if(!d||d.tm!=="tm-art"||!isOwner||!assets)return;
  if(e.origin!=="https://claude.ai"&&e.origin!==location.origin)return;
  if(typeof d.id!=="string"||typeof d.data!=="string"||!/^data:image\/(webp|jpeg|png);base64,/.test(d.data))return;
  if(!STATE.items.some(c=>c.id===d.id))return;
  artQueue++;
  try{const m=d.data.match(/^data:([^;]+);base64,(.*)$/);const bin=atob(m[2]);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);const blob=new Blob([u8],{type:m[1]});const r=await assets.upload(blob);STATE.art[d.id]=r.url;
    try{e.source&&e.source.postMessage({tm:"tm-art-ok",id:d.id},e.origin)}catch(_){}}
  catch(err){try{e.source&&e.source.postMessage({tm:"tm-art-fail",id:d.id,err:String(err&&err.code||err)},e.origin)}catch(_){}}
  artQueue--;
  if(!artQueue){clearTimeout(pendingPublish);pendingPublish=setTimeout(()=>save(null,true),4000)}
});

/* ---------- saving: publish the page with new embedded state ---------- */
function buildDoc(){
  const json=JSON.stringify(STATE).replace(/</g,"\\u003c");
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n'+HEAD+'\n'
    +'<style id="app-style">'+$("#app-style").textContent+'</style>\n</head>\n<body>\n<div id="root"></div>\n'
    +'<script type="application/json" id="state">'+json+'<\/script>\n'
    +'<script id="app-script">'+$("#app-script").textContent+'<\/script>\n</body>\n</html>';
}
async function save(msg,quiet){
  if(!artifact){toast("Open this page on claude.ai to save changes.");return}
  if(msg)toast(msg+" Saving…");
  try{await artifact.publish(buildDoc())}
  catch(e){const c=e&&e.code;if(c==="conflict")return;if(!quiet||c)toast(c==="not_granted"||c==="not_writer"?"This view cannot save changes.":"That change was not saved. Try again.")}
}

/* ---------- sync from the tracker's Drive feed ---------- */
function filesOf(p){
  if(typeof p==="string"){try{p=JSON.parse(p)}catch(e){return []}}
  if(Array.isArray(p))return p;
  if(!p||typeof p!=="object")return [];
  for(const k of ["files","items","results","data"])if(Array.isArray(p[k]))return p[k];
  return [];
}
function decodeB64(b64){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder("utf-8").decode(u)}
function errText(c){
  return c==="server_not_connected"?"Google Drive is not connected to this Claude account. Add it in Settings, Connectors.":
    c==="needs_reauth"?"Google Drive needs to be reconnected in Settings, Connectors.":
    c==="approval_required"||c==="consent_required"?"Click Sync from tracker and allow Google Drive when asked.":
    c==="not_in_manifest"||c==="blocked_by_policy"?"Google Drive is turned off for this page. Allow it from the page permissions.":
    c==="selection_required"?"Choose which Google Drive account to use when asked, then sync again.":
    "Could not reach the tracker feed. Try Sync from tracker again.";
}
async function download(fileId,mime){
  const dl=await mcp.callTool("Google Drive","download_file_content",mime?{fileId,exportMimeType:mime}:{fileId},{cache:false});
  const p=dl&&dl.payload;const b64=p&&typeof p==="object"?p.content:null;
  if(!b64)throw {code:"shape"};
  return decodeB64(b64);
}
/* 1) the tracker's full feed in the Drive folder, when the tracker publishes one */
async function readFeed(){
  const res=await mcp.callTool("Google Drive","search_files",{query:"parentId = '"+FOLDER+"' and trashed = false",excludeContentSnippets:true,pageSize:25},{cache:false});
  const files=filesOf(res&&res.payload).filter(f=>f&&f.id&&/feed/i.test(f.title||f.name||""));
  if(!files.length)return null;
  files.sort((a,b)=>String(b.modifiedTime||b.createdTime||"").localeCompare(String(a.modifiedTime||a.createdTime||"")));
  const feed=JSON.parse(await download(files[0].id));
  return feed&&Array.isArray(feed.items)?feed:null;
}
/* 2) the tracker's Google Sheet: Asking each, Qty and Status by ID */
function parseCSV(t){const rows=[];let row=[],f="",i=0,qd=false;t=t.replace(/^﻿/,"");
  while(i<t.length){const ch=t[i];
    if(qd){if(ch==='"'){if(t[i+1]==='"'){f+='"';i+=2;continue}qd=false;i++;continue}f+=ch;i++;continue}
    if(ch==='"'){qd=true;i++;continue}if(ch===","){row.push(f);f="";i++;continue}
    if(ch==="\r"){i++;continue}if(ch==="\n"){row.push(f);rows.push(row);row=[];f="";i++;continue}f+=ch;i++}
  if(f!==""||row.length){row.push(f);rows.push(row)}return rows}
const STATUS_IN={"for sale":"sale","price check":"check","keeping":"hold","at grading":"grading","in transit":"incoming","sold out":"sold"};
const KIND_IN={raw:"raw",slab:"slab",sealed:"sealed"};
async function readSheet(){
  const rows=parseCSV(await download(SHEET,"text/csv"));
  const h=(rows.shift()||[]).map(x=>x.trim().toLowerCase());
  const col=n=>h.findIndex(x=>x.startsWith(n));
  const ci={id:col("id"),name:col("name"),num:col("card number"),ver:col("version"),kind:col("type"),grade:col("grade"),qty:col("qty"),ask:col("asking"),status:col("status")};
  if(ci.id<0||ci.ask<0)throw {code:"headers"};
  const num=x=>{x=String(x==null?"":x).replace(/[$,\s]/g,"");if(x==="")return null;const n=parseFloat(x);return isFinite(n)?Math.round(n*100)/100:null};
  return rows.filter(r=>r[ci.id]&&r[ci.id].trim()).map(r=>({id:r[ci.id].trim(),name:ci.name>=0?r[ci.name]:"",num:ci.num>=0?r[ci.num]:"",ver:ci.ver>=0?r[ci.ver]:"",kind:KIND_IN[String(r[ci.kind]||"").trim().toLowerCase()]||"raw",grade:ci.grade>=0?r[ci.grade]:"",qty:num(r[ci.qty]),ask:num(r[ci.ask]),status:STATUS_IN[String(r[ci.status]||"").trim().toLowerCase()]||"sale"}));
}
function mergeSheet(rows){
  const by=new Map(STATE.items.map(c=>[c.id,Object.assign({},c)]));let max=Math.max(0,...STATE.items.map(c=>c.order||0));
  for(const r of rows){const c=by.get(r.id);
    if(c){c.ask=r.ask;if(r.qty!=null)c.qty=r.qty;c.status=r.status;if(r.name)c.name=r.name;if(r.num)c.num=r.num;if(r.ver)c.ver=r.ver;c.kind=r.kind||c.kind;c.grade=r.grade||""}
    else if(r.name)by.set(r.id,{id:r.id,name:r.name,num:r.num,ver:r.ver,set:"",kind:r.kind,grade:r.grade||"",qty:r.qty==null?1:r.qty,ask:r.ask,status:r.status,added:new Date().toISOString().slice(0,10),order:++max});}
  return [...by.values()].sort((a,b)=>(a.order||0)-(b.order||0));
}
async function syncFromDrive(manual){
  if(!mcp||syncBusy)return;
  syncBusy=true;syncMsg=manual?"Checking your tracker…":"";renderOwner();
  try{
    let next=null,stamp=null,feed=null;
    try{feed=await readFeed()}catch(e){if(e&&e.code&&e.code!=="tool_error"&&e.code!=="shape")throw e}
    if(feed&&(!STATE.updated||!feed.updated||feed.updated>STATE.updated)){next=feed.items;stamp=feed.updated}
    else if(!feed){next=mergeSheet(await readSheet());stamp=new Date().toISOString()}
    if(!next||JSON.stringify(next)===JSON.stringify(STATE.items)){STATE.syncedAt=STATE.syncedAt||null;syncMsg=manual?"Already up to date with your tracker.":"";throw {quiet:true}}
    STATE.items=next;STATE.updated=stamp||new Date().toISOString();STATE.syncedAt=new Date().toISOString();
    syncMsg="Updated from your tracker. Publishing…";renderOwner();
    await save(null,true);
  }catch(e){
    if(!(e&&e.quiet))syncMsg=e&&e.code==="headers"?"The sheet's header row changed. Keep ID and Asking each as column names.":errText(e&&e.code);
  }
  syncBusy=false;renderOwner();
}
